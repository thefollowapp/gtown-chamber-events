<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Germantown Area Chamber of Commerce - Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hunter: #123524;
    --hunter-dark: #0B241A;
    --kelly: #3C9F52;
    --kelly-light: #6FC96C;
    --kelly-pale: #E8F5E9;
    --bg: #F4F7F2;
    --card: #FFFFFF;
    --ink: #16261E;
    --ink-soft: #4B5D53;
    --line: #DCE6DD;
    --gold: #C9A227;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  header {
    background: var(--hunter);
    color: white;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
    border-bottom: 6px solid var(--kelly);
  }
  .brand {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.4px;
    white-space: nowrap;
    flex: 1;
  }
  .corner-logo {
    position: fixed;
    bottom: 20px;
    right: 20px;
    height: 64px;
    width: auto;
    opacity: 0.92;
    pointer-events: none;
    z-index: 500;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
  }
  .homebtn {
    background: var(--kelly);
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 999px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    white-space: nowrap;
    display: none;
  }

  main { flex: 1; overflow: hidden; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 32px; }

  .sectionlabel {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 18px 4px;
  }

  .eventcard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
  }
  .eventcard:active { background: var(--kelly-pale); }
  .eventcard-left { flex: 1; min-width: 0; }
  .eventdate {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--kelly);
    margin-bottom: 6px;
  }
  .eventtime { color: var(--ink-soft); font-weight: 600; font-size: 14px; }
  .eventtitle {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--hunter);
    margin-top: 6px;
    line-height: 1.25;
  }
  .eventarrow { font-size: 24px; color: var(--kelly); flex-shrink: 0; }
  .eventcard-logo {
    height: 44px; width: 44px; object-fit: contain; flex-shrink: 0;
    border-radius: 8px; background: white;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(11,36,26,0.55);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px;
  }
  .overlay.active { display: flex; }
  .detailcard {
    background: var(--card); border-radius: var(--radius); padding: 34px;
    max-width: 560px; width: 100%; max-height: 82vh; overflow-y: auto;
    border-top: 8px solid var(--kelly);
  }
  .detaillogo {
    max-height: 70px; max-width: 220px; object-fit: contain; margin-bottom: 16px;
  }
  .detaildate {
    font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px;
    letter-spacing: 0.6px; text-transform: uppercase; color: var(--kelly); margin-bottom: 4px;
  }
  .detailtime { color: var(--ink-soft); font-weight: 600; font-size: 15px; margin-bottom: 16px; }
  .detailname { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 25px; color: var(--hunter); margin: 0 0 14px; line-height: 1.25; }
  .detailrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .detailrow:first-of-type { border-top: none; }
  .detaillabel { color: var(--ink-soft); min-width: 80px; font-weight: 700; flex-shrink: 0; }
  .detailblurb { font-size: 16px; line-height: 1.55; color: var(--ink); }
  .closebtn {
    margin-top: 24px; width: 100%; padding: 16px; background: var(--hunter); color: white;
    border: none; border-radius: 999px; font-weight: 700; font-size: 18px; cursor: pointer;
  }
</style>
</head>
<body>

  <header>
    <div class="brand">Germantown Area Chamber of Commerce</div>
  </header>

  <main>
    <div class="view">
      <div class="sectionlabel">Upcoming Events</div>
      <div id="eventList"></div>
    </div>
  </main>

  <div class="overlay" id="detailOverlay" onclick="if(event.target===this) closeDetail()">
    <div class="detailcard" id="detailCard"></div>
  </div>

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

function renderEvents() {
  const list = document.getElementById('eventList');
  list.innerHTML = '';
  EVENTS.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'eventcard';
    card.onclick = () => openDetail(ev);
    card.innerHTML = `
      <div class="eventcard-left">
        <div class="eventdate">${escapeHtml(ev.date)}</div>
        <div class="eventtime">${escapeHtml(ev.time)}</div>
        <div class="eventtitle">${escapeHtml(ev.title)}</div>
      </div>
      <div class="eventarrow">&rsaquo;</div>
    `;
    list.appendChild(card);
  });
}

function openDetail(ev) {
  const card = document.getElementById('detailCard');
  card.innerHTML = `
    ${ev.logo ? `<img class="detaillogo" src="${ev.logo}" alt="">` : ''}
    <div class="detaildate">${escapeHtml(ev.date)}</div>
    <div class="detailtime">${escapeHtml(ev.time)}</div>
    <div class="detailname">${escapeHtml(ev.title)}</div>
    <div class="detailrow"><span class="detaillabel">Address</span><span>${escapeHtml(ev.address)}</span></div>
    <div class="detailrow"><span class="detailblurb">${escapeHtml(ev.blurb)}</span></div>
    <button class="closebtn" onclick="closeDetail()">Close</button>
  `;
  document.getElementById('detailOverlay').classList.add('active');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('active'); }

renderEvents();
</script>
</body>
</html>
